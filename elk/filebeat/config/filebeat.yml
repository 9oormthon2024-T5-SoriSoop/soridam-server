filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /logs/*.log

    json.keys_under_root: true
    json.add_error_key: true
    json.overwrite_keys: true

processors:
  - add_host_metadata: ~
  - add_docker_metadata: ~

output.logstash:
  hosts: ["logstash:5044"]

setup.kibana:
  host: "http://kibana:5601"
