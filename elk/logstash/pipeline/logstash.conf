input {
  beats {
    port => 5044
  }
}

filter {
  mutate {
    remove_field => [
      "ecs.version",
      "ecs.version.keyword",
      "host.architecture",
      "host.architecture.keyword",
      "host.containerized",
      "host.containerized.keyword",
      "host.hostname",
      "host.hostname.keyword",
      "host.mac",
      "host.mac.keyword",
      "host.os.codename",
      "host.os.codename.keyword",
      "host.os.family",
      "host.os.family.keyword",
      "host.os.kernel",
      "host.os.kernel.keyword",
      "host.os.name",
      "host.os.name.keyword",
      "host.os.platform",
      "host.os.platform.keyword",
      "host.os.type",
      "host.os.type.keyword",
      "host.os.version",
      "host.os.version.keyword",
      "log.file.path",
      "log.file.path.keyword",
      "log.offset",
      "event.original",
      "event.original.keyword",
      "durationMs.keyword",
      "level.keyword",
      "logger.keyword",
      "method.keyword",
      "status.keyword",
      "uri.keyword",
      "userId.keyword",
      "requestId.keyword"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "logstash_internal"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"
    index => "logstash-%{+YYYY.MM.dd}"
  }
}
