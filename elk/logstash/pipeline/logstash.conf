input {
  beats {
    port => 5044
  }
}

filter {
  if [message] =~ "^{.*}$" {
    json {
      source => "message"
      remove_field => ["message"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "logstash_internal"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"
    index => "logstash-%{+YYYY.MM.dd}"
  }
}
