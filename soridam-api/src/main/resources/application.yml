spring:
  config:
    import: application-oicd.yml
  application:
    name: sorisoop-server

  datasource:
    master:
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${MASTER_DB_PORT:5432}/${DB_NAME:soridam}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:root}
      driver-class-name: org.postgresql.Driver
    slave:
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${SLAVE_DB_PORT:5433}/${DB_NAME:soridam}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:root}
      driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
      default_batch_fetch_size: 1000
      jdbc:
        time_zone: Asia/Seoul
    defer-datasource-initialization: true
    show-sql: true
    open-in-view: false

  sql:
    init:
      mode: always

  elasticsearch:
    uris: http://${ES_HOST:localhost}:${ES_PORT:9200}
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 5000
    elasticsearch:
      repositories:
        enabled: true

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha

jwt:
  issuer: ${JWT_ISSUER}
  secret_key_string: ${JWT_SECRET_KEY_STRING}

oidc:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
  google:
    client-id: ${GOOGLE_CLIENT_ID}

openai:
  api:
    url: ${OPENAI_API_URL}
    key: ${OPENAI_API_KEY}

kakao:
  api:
    key: ${KAKAO_API_KEY}
    url: ${KAKAO_API_URL}