spring:
  config:
    import: application-oidc.yml
  application:
    name: sorisoop-server

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:soridam}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
      default_batch_fetch_size: 1000
      jdbc:
        time_zone: Asia/Seoul
    defer-datasource-initialization: true
    show-sql: true
    open-in-view: false

  sql:
    init:
      mode: always

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

    mongodb:
      uri: mongodb://nninjoon:${MONGO_PASSWORD}@localhost:27017/soridam?authSource=soridam
      database: soridam

  kafka:
    bootstrap-servers: 127.0.0.1:19092,127.0.0.1:19094,127.0.0.1:19096

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha

jwt:
  issuer: ${JWT_ISSUER}
  secret_key_string: ${JWT_SECRET_KEY_STRING}

oidc:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
  google:
    client-id: ${GOOGLE_CLIENT_ID}

logging:
  level:
    org:
      springframework:
        transaction:
          interceptor: DEBUG # 트랜잭션 시작, 커밋, 롤백 로그
        orm:
          jpa: DEBUG             # JPA 관련 상세 로그
      hibernate:
        SQL: DEBUG               # 실행되는 SQL 쿼리 로그
        type:
          descriptor:
            sql:
              BasicBinder: TRACE # SQL 파라미터 바인딩 값 로그


