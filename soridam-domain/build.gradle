plugins {
    id 'java-library'
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

dependencies {
    implementation project(':soridam-global-util')
    implementation project(':soridam-common')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    //db
    api 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 지리 데이터 관리 도구
    api 'org.locationtech.jts:jts-core:1.20.0'
    api 'org.hibernate:hibernate-spatial:6.6.5.Final'

    // 데이터베이스 연결
    runtimeOnly 'org.postgresql:postgresql' // PostgreSQL 드라이버
}
